version: '3.8'

services:
  # 1. База данных PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: online_store_postgres
    restart: always
    environment:
      POSTGRES_DB: online_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1111"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Apache Kafka (KRaft режим)
  kafka:
    image: apache/kafka:3.7.0
    container_name: online_store_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # 3. Веб-интерфейс для Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: online_store_kafka_ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # 4. Наше Spring Boot приложение (НОВЫЙ СЕРВИС)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_store_app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Переопределяем подключение к БД на контейнер postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/online_store
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1111"
      # Переопределяем подключение к Кафке на контейнер kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka

volumes:
  postgres_data: